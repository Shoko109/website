# ============================================================
# 管理画面（/admin）の設定 / Admin panel (/admin) configuration
#
# ログイン方法 / How to sign in:
#   OAuth アプリを設定していないため、/admin では
#   「Sign In Using Access Token」でログインします。
#   GitHub の Fine-grained Personal Access Token
#   （このリポジトリの Contents: Read and write 権限）を貼り付けるだけ。
#   Without an OAuth app configured, /admin shows "Sign In Using
#   Access Token" — paste a GitHub fine-grained PAT with
#   Contents: Read & write access to this repo.
#
# ★ 将来、翔子さんのアカウントに移すとき:
#   リポジトリを Transfer し、下の repo: を書き換えるだけ。
#   （ボタン1つのログインにしたければ GitHub OAuth App を
#     用意する方法もあります → README 参照）
# ============================================================

backend:
  name: github
  repo: Shoko109/website
  branch: main
  commit_messages:
    update: '{{path}} を管理画面から更新'
    uploadMedia: '画像 {{path}} を追加'
    deleteMedia: '画像 {{path}} を削除'

# 画像のアップロード先 / Where uploaded images go.
# src/images/uploads に入れると、ビルド時に自動で軽く（WebP化・リサイズ）
# されてから配信されます。public/images に入れた画像は、そのままの大きさで
# 配信されてしまう（スマホで重い）ので、こちらを既定にしています。
# Uploads land in src/images/uploads so Astro can optimise them at build time;
# anything in public/images is served at full size.
media_folder: src/images/uploads
public_folder: /src/images/uploads

collections:
  - name: content
    label: サイトの内容 / Site content
    editor:
      preview: false
    files:
      # ---------------- トップページ / Home page ----------------
      - name: home
        label: トップページ（お知らせ・料金など） / Home page
        file: src/data/home.json
        fields:
          - label: お知らせ / News
            name: news
            widget: list
            hint: 一番よく使う場所です。行の追加・削除・並べ替えができます。 / The most-used field. Add, remove and reorder items.
            field: { label: お知らせ文 / News item, name: item, widget: text }

          - label: レッスン日・料金 / Lesson days & prices
            name: pricing
            widget: object
            fields:
              - { label: レッスン日 / Lesson days, name: days, widget: string, hint: '例：水・木・金・日' }
              - { label: ひとこと（レッスン日の横） / Note next to lesson days, name: daysHint, widget: string }
              - label: 体験レッスン（レッスン日の下に目立つ枠で表示） / Trial lesson (highlighted under lesson days)
                name: trial
                widget: object
                fields:
                  - { label: ラベル / Label, name: label, widget: string, hint: '例：体験レッスン' }
                  - { label: 時間 / Duration, name: duration, widget: string, hint: '例：30〜45分' }
                  - { label: 料金 / Price, name: price, widget: string, hint: '例：1,000円' }
                  - { label: 補足 / Note, name: note, widget: string }
              - label: 月謝制レッスン / Monthly lessons
                name: monthly
                widget: object
                fields:
                  - { label: タイトル / Title, name: title, widget: string }
                  - { label: サブタイトル / Subtitle, name: subtitle, widget: string }
                  - label: 料金表 / Price table
                    name: rows
                    widget: list
                    fields:
                      - { label: 項目 / Item, name: item, widget: string }
                      - { label: 料金 / Price, name: price, widget: string }
                  - { label: 補足 / Note, name: note, widget: string }
              - label: ワンレッスン・体験レッスン / Single & trial lessons
                name: single
                widget: object
                fields:
                  - { label: タイトル / Title, name: title, widget: string }
                  - { label: サブタイトル / Subtitle, name: subtitle, widget: string }
                  - label: 料金表 / Price table
                    name: rows
                    widget: list
                    fields:
                      - { label: 項目 / Item, name: item, widget: string }
                      - { label: 料金 / Price, name: price, widget: string }
                  - { label: 補足 / Note, name: note, widget: string }

          - label: メインビジュアル（一番上） / Hero (top of page)
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: 大見出し（1行目） / Big heading (line 1), name: titleLine1, widget: string }
              - { label: '大見出し（2行目・強調） / Big heading (line 2, italic)', name: titleLine2, widget: string }
              - { label: '大見出しの小さな3行目（場所。検索で見つけてもらうための大事な一行です） / Small third line (location — matters for search)', name: titleSub, widget: string, required: false }
              - { label: 紹介文 / Lead text, name: lead, widget: text }
              - { label: 場所の表記 / Location line, name: place, widget: string }
              - label: 写真（右側の街並みの写真） / Photo (town photo on the right)
                name: image
                widget: image
                media_folder: "src/images/uploads"
                public_folder: "/src/images/uploads"
                choose_url: false

          - label: 教室について / About the school
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: はじめの文章 / Opening paragraph, name: intro, widget: text }
              - label: 大切にしていること（箇条書き） / Key points (bullets)
                name: points
                widget: list
                field: { label: 項目 / Point, name: item, widget: string }
              - { label: むすびの文章 / Closing paragraph, name: outro, widget: text }
              - label: 写真（レッスン室の写真） / Photo (lesson room photo)
                name: image
                widget: image
                media_folder: "src/images/uploads"
                public_folder: "/src/images/uploads"
                choose_url: false

          - label: レッスン内容 / Lesson details
            name: lesson
            widget: object
            collapsed: true
            fields:
              - { label: 「お子さま」見出し / Children heading, name: kidsTitle, widget: string }
              - { label: 「お子さま」本文 / Children text, name: kidsText, widget: text }
              - { label: 「大人の方」見出し / Adults heading, name: adultsTitle, widget: string }
              - { label: 「大人の方」本文 / Adults text, name: adultsText, widget: text }
              - { label: 「大人の方」注意書き / Adults note, name: adultsNote, widget: string }

          - label: 生徒さんのご感想 / Testimonials
            name: voices
            widget: list
            collapsed: true
            fields:
              - { label: 感想の文章 / Testimonial text, name: text, widget: text }
              - { label: どなたから（例：― 保護者さまより） / From whom, name: who, widget: string }

          - label: 講師紹介（トップの短い紹介文） / Teacher intro on home page
            name: teacherTeaser
            widget: object
            collapsed: true
            fields:
              - { label: 紹介文 / Summary, name: summary, widget: text }

          - label: アクセス / Access
            name: access
            widget: object
            collapsed: true
            fields:
              - { label: 最寄駅 / Nearest station, name: station, widget: string }
              - { label: 所在地 / Address, name: address, widget: string }
              - { label: 所在地の補足 / Address note, name: addressNote, widget: string }
              - { label: 駐車場 / Parking, name: parking, widget: text }
              - { label: 周辺エリアの案内文 / Area note, name: areaNote, widget: text }

          - label: 一番下の申し込みバナー / Bottom CTA banner
            name: ctaBand
            widget: object
            collapsed: true
            fields:
              - { label: 見出し / Heading, name: title, widget: string }
              - { label: 文章 / Text, name: text, widget: string, required: false }

      # ---------------- プロフィールページ / Profile page ----------------
      - name: profile
        label: 講師プロフィール / Teacher profile
        file: src/data/profile.json
        fields:
          - label: 写真 / Photo
            name: image
            widget: image
            media_folder: "src/images/uploads"
            public_folder: "/src/images/uploads"
            choose_url: false
          - { label: お名前 / Name, name: name, widget: string }
          - { label: お名前（ローマ字） / Name (romaji), name: nameEn, widget: string }
          - label: 経歴の文章（段落ごと） / Bio (one paragraph per item)
            name: bio
            widget: list
            hint: 1項目が1段落になります。 / Each item becomes one paragraph.
            field: { label: 段落 / Paragraph, name: item, widget: text }
          - label: タグ（経歴の下の小さなラベル） / Tags (small labels under bio)
            name: tags
            widget: list
            field: { label: タグ / Tag, name: item, widget: string }

      # ---------------- レッスンの様子ページ / About the lessons page ----------------
      - name: lessons
        label: レッスンの様子（写真） / About the lessons (photos)
        file: src/data/lessons.json
        fields:
          - { label: 見出しの下の文章 / Intro text, name: intro, widget: text }
          - label: 写真 / Photos
            name: photos
            widget: list
            hint: 「＋」で写真を追加できます。ドラッグで並べ替え、いちばん上の写真は大きく表示されます。 / Add photos with “+”. Drag to reorder; the first photo is shown large.
            # ※いまは仮のフリー素材（外部リンク）が入っています。「写真」欄から
            #   教室の写真をアップロードすると、そのまま差し替わります。
            fields:
              - { label: 写真 / Photo, name: image, widget: image, choose_url: false, hint: 横長の写真がきれいに表示されます。 / Landscape photos look best. }
              - { label: 写真の見出し / Caption title, name: title, widget: string, hint: '例：レッスン室' }
              - { label: 写真の説明 / Caption text, name: text, widget: text, required: false }
          - { label: いちばん下の文章 / Closing text, name: outro, widget: text, required: false }

      # ---------------- 演奏会ページ / Concerts page ----------------
      - name: concerts
        label: 演奏会情報 / Concerts
        file: src/data/concerts.json
        fields:
          - { label: 見出しの下のひとこと / Line under the heading, name: intro, widget: text }
          - label: 今後の演奏会 / Upcoming concerts
            name: upcoming
            widget: list
            hint: 終わった演奏会は「これまでの演奏会」へ移してください。ドラッグで並べ替えできます。 / Move finished concerts to “Past”. Drag to reorder.
            fields:
              - { label: 日付 / Date, name: date, widget: string, hint: '例：2026年9月23日（火・祝）' }
              - { label: 開演時間など / Time etc., name: time, widget: string, required: false, hint: '例：開演 14:00（開場 13:30）' }
              - { label: ちらし画像 / Flyer image, name: image, widget: image, required: false, choose_url: false, hint: チラシの画像があれば入れてください（なくてもOK）。 / Optional flyer image. }
              - { label: 演奏会名 / Title, name: title, widget: string }
              - { label: 会場 / Venue, name: venue, widget: string }
              - { label: 地域 / Area, name: area, widget: string, required: false, hint: '例：東京・町田市' }
              - label: 共演者 / Performers
                name: collaborators
                widget: list
                required: false
                field: { label: 共演者 / Performer, name: item, widget: string, hint: '例：ヴァイオリン：小林 美和' }
              - label: 曲目 / Program
                name: program
                widget: list
                required: false
                field: { label: 曲目 / Piece, name: item, widget: string }
              - { label: 詳細・チケットのURL / Detail / ticket URL, name: link, widget: string, required: false }
              - { label: リンクの文字 / Link text, name: linkLabel, widget: string, required: false, default: 詳細・チケット }
          - label: これまでの演奏会 / Past concerts
            name: past
            widget: list
            fields:
              - { label: 日付 / Date, name: date, widget: string }
              - { label: 開演時間など / Time etc., name: time, widget: string, required: false }
              - { label: ちらし画像 / Flyer image, name: image, widget: image, required: false, choose_url: false }
              - { label: 演奏会名 / Title, name: title, widget: string }
              - { label: 会場 / Venue, name: venue, widget: string }
              - { label: 地域 / Area, name: area, widget: string, required: false }
              - label: 共演者 / Performers
                name: collaborators
                widget: list
                required: false
                field: { label: 共演者 / Performer, name: item, widget: string }
              - label: 曲目 / Program
                name: program
                widget: list
                required: false
                field: { label: 曲目 / Piece, name: item, widget: string }
              - { label: 詳細のURL / Detail URL, name: link, widget: string, required: false }
              - { label: リンクの文字 / Link text, name: linkLabel, widget: string, required: false }

      # ---------------- お問い合わせページ / Contact page ----------------
      - name: contact
        label: お問い合わせページ / Contact page
        file: src/data/contact.json
        fields:
          - { label: 見出しの下のひとこと / Line under the heading, name: pageLead, widget: string }
          - { label: 「体験レッスンについて」見出し / Trial lesson heading, name: trialTitle, widget: string }
          - { label: 体験レッスンの案内文（料金もここ） / Trial lesson text (incl. price), name: trialText, widget: text }
          - { label: 教室の場所の案内文 / Location text, name: locationText, widget: text }

      # ---------------- 基本情報 / Site basics ----------------
      - name: site
        label: 基本情報（メール・ブログなど） / Site basics
        file: src/data/site.json
        fields:
          - { label: 教室名 / School name, name: name, widget: string }
          - { label: 教室名（ローマ字） / School name (romaji), name: nameEn, widget: string }
          - { label: メールアドレス / Email address, name: email, widget: string }
          - { label: ブログのURL / Blog URL, name: blogUrl, widget: string }
          - { label: フッターの説明文（検索対策） / Footer SEO text, name: footerSeo, widget: text }
