# ============================================================
# Cloudflare Workers（静的アセット）の設定 / Cloudflare Workers static assets
#
# ビルドで作られた dist/ を、そのまま配信する設定です。
# Worker のスクリプトは無いので main はありません（アセットだけの Worker）。
#
# ★ name は、ダッシュボードで作った Worker の名前と
#   まったく同じでなければいけません。ちがう名前にすると、
#   別の Worker が新しく作られてしまいます。
#   `name` MUST match the Worker created in the dashboard — otherwise
#   `wrangler deploy` publishes to a different Worker.
#
# ダッシュボード側の設定 / Workers Builds settings:
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
#   Node version:   .node-version（20）を自動で読みます
# ============================================================
name = "tsurukawa-harunasaka-piano"
compatibility_date = "2026-09-08"

[assets]
directory = "./dist"
# dist/_headers（noindex・キャッシュ設定）もここから読まれます。
# _headers in dist/ is applied to these assets.
